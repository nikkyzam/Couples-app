name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/couples-intimacy-games-app-gbzfzo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Optional: set these as repo secrets (Settings → Secrets and variables →
          # Actions) to enable cross-device sync on the deployed site. Leave unset
          # and the app runs fully offline in local-only mode.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: set to enable background push (notifications when the app is
          # closed). The PUBLIC VAPID key — safe to expose in the client bundle.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # Optional: gates the whole deployed site behind a shared passphrase. This
          # is a SHA-256 hash, not the passphrase itself — see .env.example.
          VITE_SITE_PASSPHRASE_HASH: ${{ secrets.VITE_SITE_PASSPHRASE_HASH }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
